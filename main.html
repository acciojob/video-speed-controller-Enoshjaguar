<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wrapper">
    <video id="video" class="flex" width="765" height="430" src="https://www.w3schools.com/html/mov_bbb.mp4"controls></video>
    <button id="player__buttontoggle">▶️</button>
	  <input id='progress__filled' type='range' min=0 max=100 value = 0>
	  <input id='volume' type='range' min=0 max=100 value=75>
	  <select id="speed">
    <option value="0.5">0.5x</option>
    <option value="0.75">0.75x</option>
    <option value="1" selected>1x</option>
    <option value="1.25">1.25x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
</select>
	  <button id="rewind">« 10s</button>
<button id="forward">25s »</button>
	  <div class="speed">
		
      <div class="speed-bar">1×</div>
    </div>
  </div>

<script  src="./script.js">
  //Your code goes here
</script>
</body>
</html>
